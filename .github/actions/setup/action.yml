name: Set up build job
description: LFS assets, the pinned toolchain (.toolchain-versions), emsdk and ccache shared by the CI jobs.

inputs:
  lfs:
    description: Pull git-LFS assets (cached by object list).
    default: "false"
  native:
    description: Install the pinned LLVM; on Linux also the GLFW/GL/X headers and xvfb.
    default: "true"
  extra-packages:
    description: Additional apt packages.
    default: ""
  emsdk:
    description: Activate the emsdk pinned by .emsdk-version, plus the pinned Node.
    default: "false"
  ccache-key:
    description: ccache key; empty disables ccache.
    default: ""
  ccache-size:
    description: ccache max size.
    default: "400M"

runs:
  using: composite
  steps:
    - name: Read pinned tool versions
      id: versions
      shell: bash
      run: grep -E '^[A-Z0-9_]+=' .toolchain-versions >> "$GITHUB_OUTPUT"

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.versions.outputs.PYTHON_VERSION }}

    # Every job configures or builds with CMake and Ninja: the same pinned wheels as locally.
    - name: Install pinned CMake and Ninja
      shell: bash
      run: |
        python scripts/setup_buildtools.py
        dir="${USERPROFILE:-$HOME}/.neotolis/toolchain/buildtools-cmake-${{ steps.versions.outputs.CMAKE_VERSION }}-ninja-${{ steps.versions.outputs.NINJA_VERSION }}"
        if command -v cygpath > /dev/null; then dir="$(cygpath -m "$dir")"; fi
        # GITHUB_PATH prepends, so the native cmake added last wins over the bin/ launchers.
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "$dir/cmake/data/bin" >> "$GITHUB_PATH"
        "$dir/cmake/data/bin/cmake" --version | head -1
        "$dir/bin/ninja" --version

    - name: Create LFS file list
      if: inputs.lfs == 'true'
      shell: bash
      run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

    - uses: actions/cache@v6
      if: inputs.lfs == 'true'
      with:
        path: .git/lfs/objects
        key: lfs-${{ hashFiles('.lfs-assets-id') }}

    - name: Pull LFS files
      if: inputs.lfs == 'true'
      shell: bash
      run: git lfs pull

    # The same per-user directory scripts/setup_llvm.py installs into locally.
    - uses: actions/cache@v6
      if: inputs.native == 'true'
      id: llvm-cache
      with:
        path: ~/.neotolis/toolchain/llvm-${{ steps.versions.outputs.LLVM_VERSION }}
        key: llvm-${{ steps.versions.outputs.LLVM_VERSION }}-${{ runner.os }}-${{ hashFiles('scripts/setup_llvm.py') }}

    - name: Install pinned LLVM
      if: inputs.native == 'true'
      shell: bash
      run: |
        python scripts/setup_llvm.py
        bin="${USERPROFILE:-$HOME}/.neotolis/toolchain/llvm-${{ steps.versions.outputs.LLVM_VERSION }}/bin"
        if command -v cygpath > /dev/null; then bin="$(cygpath -m "$bin")"; fi
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/clang" --version

    # libgl1-mesa-dri: llvmpipe, the software GL behind xvfb for the real-GL tests.
    - name: Install native packages
      if: runner.os == 'Linux' && (inputs.native == 'true' || inputs.extra-packages != '')
      shell: bash
      run: |
        packages="${{ inputs.extra-packages }}"
        if [ "${{ inputs.native }}" = "true" ]; then
          packages="libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libgl-dev libgl1-mesa-dri libssl-dev xvfb $packages"
        fi
        sudo apt-get update && sudo apt-get install -y $packages

    - name: Read emsdk version
      if: inputs.emsdk == 'true'
      id: emsdk-version
      shell: bash
      run: echo "version=$(cat .emsdk-version)" >> "$GITHUB_OUTPUT"

    # A fixed install path keeps sysroot header paths, and so ccache keys, stable across
    # runs; the per-job key also keeps the Emscripten system libraries that job built.
    - uses: actions/cache@v6
      if: inputs.emsdk == 'true'
      with:
        path: ~/.neotolis/toolchain/emsdk-${{ steps.emsdk-version.outputs.version }}
        key: emsdk-${{ steps.emsdk-version.outputs.version }}-${{ inputs.ccache-key }}
        restore-keys: emsdk-${{ steps.emsdk-version.outputs.version }}-

    - name: Install emsdk
      if: inputs.emsdk == 'true'
      shell: bash
      run: |
        bash scripts/setup_emsdk.sh
        dir="$HOME/.neotolis/toolchain/emsdk-${{ steps.emsdk-version.outputs.version }}"
        echo "EMSDK=$dir" >> "$GITHUB_ENV"
        echo "EM_CONFIG=$dir/.emscripten" >> "$GITHUB_ENV"
        echo "$dir" >> "$GITHUB_PATH"
        echo "$dir/upstream/emscripten" >> "$GITHUB_PATH"

    - uses: actions/setup-node@v7
      if: inputs.emsdk == 'true'
      with:
        node-version: ${{ steps.versions.outputs.NODE_VERSION }}

    - uses: hendrikmuhs/ccache-action@v1.2.25
      if: inputs.ccache-key != ''
      with:
        key: ${{ inputs.ccache-key }}
        max-size: ${{ inputs.ccache-size }}

    # emcc is a python wrapper: an mtime compiler check is unreliable across emsdk cache restores.
    - name: Enable ccache compiler launcher
      if: inputs.ccache-key != ''
      shell: bash
      run: |
        echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        if [ "${{ inputs.emsdk }}" = "true" ]; then
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
        fi
