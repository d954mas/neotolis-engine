name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job graph: only the wasm jobs wait, for the release packs and the Basis goldens.
# Every other job starts at once; native test configures skip pack generation
# (tests read their own fixtures) so no debug builder re-encodes the examples.
env:
  # Basis admission rows shared by the native and browser jobs: `name:flags`, rows separated
  # by spaces, several -D flags inside one row by commas (expanded with ${flags//,/ }).
  # Three rows: UASTC-only (the smallest transcoder), ETC1S with ETC2 as the only compressed
  # target, and both codecs with BC7 as the only compressed target. Together they cover both
  # single-codec decoders and upload+sample every compressed target through the runner's software GL.
  NT_BASISU_ROWS: "basisu-uastc-only:-DNT_BASISU_HAS_ETC1S=OFF basisu-etc1s-etc2:-DNT_BASISU_HAS_UASTC=OFF,-DNT_BASISU_HAS_BC7=OFF,-DNT_BASISU_HAS_ASTC=OFF basisu-bc7-only:-DNT_BASISU_HAS_ETC2=OFF,-DNT_BASISU_HAS_ASTC=OFF"
  # Every example pack set; the packs job fails when an example is missing here.
  # Narrow configures (Basis/font/Clay rows, goldens) also pass -DNT_HTTP_CURL=OFF: none of
  # their tests use HTTP, and configuring vendored curl doubles the configure time.
  NT_ALL_EXAMPLE_PACKS: "asteroids;atlas;bunnymark;rtt_showcase;skeletal_showcase;slice9_demo;sponza;text;textured_quad;ui_3d_demo;ui_showcase"

jobs:
  # #region producers
  packs:
    name: Native Release & Packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lfs: "true"
          ccache-key: packs

      - name: Configure native release
        run: cmake --preset native-release

      # Cold sponza encode is the long pole (up to ~2h); the cache keeps it in seconds.
      - name: Restore builder cache
        uses: actions/cache@v4
        with:
          path: build/examples/*/_cache
          key: builder-cache-${{ github.sha }}
          restore-keys: builder-cache-

      # 180 min: cold ccache compile + cold sponza encode share this step, and a
      # timed-out job saves no caches — the retry would be equally cold.
      - name: Build native release (all targets)
        timeout-minutes: 180
        run: cmake --build --preset native-release

      - name: Verify native release output
        run: |
          test -f build/engine/native-release/libnt_core.a
          test -f build/engine/native-release/libnt_log.a
          test -f build/engine/native-release/libnt_log_stub.a
          ./build/tools/builder/native-release/builder

      # Missing or partial packs already failed the build (copy edges + success stamp,
      # cmake/nt_example_packs.cmake). Silent drifts: an example whose build_packs.c was
      # never wired, one missing from NT_ALL_EXAMPLE_PACKS (test jobs would re-encode it),
      # and stale committed codegen headers (wasm/deploy compile against the committed copies).
      - name: Verify example packs wired + headers fresh
        run: |
          bad=0
          for src in examples/*/build_packs.c; do
            name=$(basename "$(dirname "$src")")
            if [ ! -f "build/examples/$name/.expected_packs" ]; then
              echo "::error::examples/$name has build_packs.c but nt_example_packs was never wired"
              bad=1
            fi
            if [[ ";$NT_ALL_EXAMPLE_PACKS;" != *";$name;"* ]]; then
              echo "::error::examples/$name is missing from NT_ALL_EXAMPLE_PACKS in ci.yml"
              bad=1
            fi
          done
          git diff --exit-code -- 'examples/*/generated' || {
            echo "::error::committed generated headers are stale — commit the refresh"
            bad=1
          }
          exit $bad

      - name: Upload example packs
        uses: actions/upload-artifact@v4
        with:
          name: example-packs
          path: build/examples/*/*.ntpack
          retention-days: 1
          if-no-files-found: error

  # The full Basis baseline feeds every wasm test_basisu_trimmed run.
  goldens:
    name: Basis Goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lfs: "true"
          ccache-key: goldens

      - name: Produce and check the Basis goldens
        run: |
          cmake --preset native-release-test -DNT_HTTP_CURL=OFF -DNT_SKIP_EXAMPLE_PACKS="$NT_ALL_EXAMPLE_PACKS"
          cmake --build --preset native-release-test --target test_basisu_golden_produce
          ctest --preset native-release-test --no-tests=error -R '^test_basisu_golden_produce$'

      - name: Upload Basis goldens
        uses: actions/upload-artifact@v4
        with:
          name: basisu-goldens
          path: |
            build/tests/basisu_golden/*.basis
            build/tests/basisu_golden/*.bin
          retention-days: 1
          if-no-files-found: error
  # #endregion

  # #region wasm
  wasm-debug:
    name: WASM Debug
    runs-on: ubuntu-latest
    needs: [packs, goldens]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lfs: "true"
          native: "false"
          emsdk: "true"
          ccache-key: wasm-debug
          ccache-size: 600M

      # Restores build/examples/<name>/<pack>.ntpack — upload-artifact roots the
      # archive at the pre-wildcard prefix of its glob (build/examples).
      - uses: actions/download-artifact@v4
        with:
          name: example-packs
          path: build/examples
      - uses: actions/download-artifact@v4
        with:
          name: basisu-goldens
          path: build/tests/basisu_golden

      # The paired preset's index.wasm is the baseline build (it differs from wasm-debug only
      # by the SIMD path in the HTML shell), so CI links each configuration once.
      - name: Build paired WASM debug (baseline + SIMD)
        run: |
          ./scripts/build_wasm_paired.sh wasm-debug-paired
          for f in index.html index.js index.wasm index_simd.wasm index_simd.js; do
            test -f "build/examples/hello/wasm-debug-paired/$f"
          done
          for f in index.html index.js index.wasm; do
            test -f "build/examples/hello/wasm-debug-simd/$f"
          done
          for p in wasm-debug-paired wasm-debug-simd; do
            for lib in libnt_core.a libnt_log.a libnt_log_stub.a; do
              test -f "build/engine/$p/$lib"
            done
          done
          for example in hello bench_shapes spinning_cube textured_quad sponza text bunnymark; do
            test -f "build/examples/$example/wasm-debug-paired/index_simd.wasm"
          done

      # The ctest includes test_basisu_trimmed: the production wasm transcoder decodes the
      # native goldens under Node.
      - name: Test paired WASM debug
        run: |
          node tests/wasm/smoke_test.js wasm-debug-paired
          node tests/wasm/smoke_test.js wasm-debug-simd
          ctest --preset wasm-debug-paired
          ctest --preset wasm-debug-simd

  wasm-release:
    name: WASM Release & Sizes
    runs-on: ubuntu-latest
    needs: [packs, goldens]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lfs: "true"
          native: "false"
          emsdk: "true"
          ccache-key: wasm-release
          ccache-size: 600M

      - uses: actions/download-artifact@v4
        with:
          name: example-packs
          path: build/examples
      - uses: actions/download-artifact@v4
        with:
          name: basisu-goldens
          path: build/tests/basisu_golden

      - name: Verify optional UI composition in WASM release
        run: |
          emcmake cmake -S tests/submodule -B build/_cmake/ui-composition-wasm-release -G Ninja -DENGINE_ROOT="$PWD" -DCMAKE_BUILD_TYPE=Release -DNT_BUILD_TESTS=OFF -DNT_FONT_EMBOLDEN_ENABLED=OFF -DNT_UI_CLAY_DEBUG_VIEW=OFF -DNT_UI_DEBUG_TOOLS=OFF
          python3 scripts/check_ui_composition.py build/_cmake/ui-composition-wasm-release --nm "$EMSDK/upstream/bin/llvm-nm"

      - name: Build optional UI features in WASM release
        run: |
          emcmake cmake --preset wasm-release -B build/_cmake/wasm-release-ui-on -DNT_FONT_EMBOLDEN_ENABLED=ON -DNT_UI_CLAY_DEBUG_VIEW=ON
          cmake --build build/_cmake/wasm-release-ui-on --target ui_showcase

      # The paired index.wasm is the wasm-release baseline (only the shell differs).
      - name: Build paired WASM release (baseline + SIMD)
        run: |
          ./scripts/build_wasm_paired.sh wasm-release-paired
          for f in index.html index.js index.wasm index_simd.wasm index_simd.js; do
            test -f "build/examples/hello/wasm-release-paired/$f"
          done
          for f in index.html index.js index.wasm; do
            test -f "build/examples/hello/wasm-release-simd/$f"
          done
          for p in wasm-release-paired wasm-release-simd; do
            for lib in libnt_core.a libnt_log.a libnt_log_stub.a; do
              test -f "build/engine/$p/$lib"
            done
          done
          for example in hello bench_shapes spinning_cube textured_quad sponza text bunnymark; do
            test -f "build/examples/$example/wasm-release-paired/index_simd.wasm"
          done

      - name: Verify gfx capture producers are absent in WASM release
        run: |
          symbols="$("$EMSDK/upstream/bin/llvm-nm" --defined-only build/engine/wasm-release-paired/libnt_gfx.a)"
          # Positive control: the listing must see ordinary gfx symbols.
          grep -q "nt_gfx_init" <<< "$symbols"
          for producer in g_nt_gfx_capture nt_gfx_backend_capture_initial_state nt_gfx_gl_call_name; do
            if grep -q "$producer" <<< "$symbols"; then
              echo "wasm-release nt_gfx retains capture producer: $producer"
              exit 1
            fi
          done

      - name: Test paired WASM release
        run: |
          node tests/wasm/smoke_test.js wasm-release-paired
          node tests/wasm/smoke_test.js wasm-release-simd
          ctest --preset wasm-release-paired
          ctest --preset wasm-release-simd

      # The size chart measures these dirs: the effective cache, not the preset text, must carry no dev tooling.
      - name: Verify release dirs carry no dev tooling
        run: |
          for p in wasm-release-paired wasm-release-simd; do
            for v in NT_UI_DEBUG_TOOLS NT_LOG_RING_ENABLED NT_METRICS_ENABLED NT_INTROSPECT_ENABLED NT_INTROSPECT_WRITE_ENABLED; do
              grep -qx "$v:BOOL=OFF" "build/_cmake/$p/CMakeCache.txt" || { echo "::error::$p: $v is not OFF"; exit 1; }
            done
          done

      - name: Measure sizes (all examples)
        run: |
          source scripts/wasm_examples.sh
          for example in "${WASM_EXAMPLES[@]}"; do
            PRESET=wasm-release-paired bash scripts/size.sh "$example" --json > "/tmp/size_${example}.json"
          done

      - name: Upload size data
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-sizes
          path: /tmp/size_*.json
          retention-days: 1

  wasm-analysis:
    name: WASM Analysis & Reports
    runs-on: ubuntu-latest
    needs: [packs, goldens]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lfs: "true"
          native: "false"
          extra-packages: wabt
          emsdk: "true"
          ccache-key: wasm-analysis
          ccache-size: 600M

      - uses: actions/download-artifact@v4
        with:
          name: example-packs
          path: build/examples
      - uses: actions/download-artifact@v4
        with:
          name: basisu-goldens
          path: build/tests/basisu_golden

      - name: Build paired WASM analysis (baseline + SIMD)
        run: |
          ./scripts/build_wasm_paired.sh wasm-analysis-paired
          for f in index.html index.js index.wasm index_simd.wasm index_simd.js; do
            test -f "build/examples/hello/wasm-analysis-paired/$f"
          done
          for f in index.html index.js index.wasm; do
            test -f "build/examples/hello/wasm-analysis-simd/$f"
          done
          for p in wasm-analysis-paired wasm-analysis-simd; do
            for lib in libnt_core.a libnt_log.a libnt_log_stub.a; do
              test -f "build/engine/$p/$lib"
            done
          done
          for example in hello bench_shapes spinning_cube textured_quad sponza text bunnymark; do
            test -f "build/examples/$example/wasm-analysis-paired/index_simd.wasm"
          done

      - name: Test paired WASM analysis
        run: |
          node tests/wasm/smoke_test.js wasm-analysis-paired
          node tests/wasm/smoke_test.js wasm-analysis-simd
          ctest --preset wasm-analysis-paired
          ctest --preset wasm-analysis-simd

      # Names are retained and devapi is off, so the symbol-absence check is real, not vacuous.
      - name: DevAPI zero-delta check (devapi-OFF WASM has no devapi surface)
        run: PRESET=wasm-analysis-paired bash scripts/devapi-zero-delta.sh hello

      - name: Verify analysis dirs carry no dev tooling
        run: |
          for p in wasm-analysis-paired wasm-analysis-simd; do
            for v in NT_UI_DEBUG_TOOLS NT_LOG_RING_ENABLED NT_METRICS_ENABLED NT_INTROSPECT_ENABLED NT_INTROSPECT_WRITE_ENABLED; do
              grep -qx "$v:BOOL=OFF" "build/_cmake/$p/CMakeCache.txt" || { echo "::error::$p: $v is not OFF"; exit 1; }
            done
          done

      - name: Generate size reports (all examples)
        run: |
          # tee would otherwise mask a size-report.sh failure behind its own exit status.
          set -o pipefail
          source scripts/wasm_examples.sh
          for example in "${WASM_EXAMPLES[@]}"; do
            PRESET=wasm-analysis-paired bash scripts/size-report.sh "$example" | tee "/tmp/report_${example}.txt"
          done

      - name: Upload size reports
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-reports
          path: /tmp/report_*.txt
          retention-days: 1
  # #endregion

  # #region native tests
  # scripts/ci_ctest.sh runs every test but the `display` label in parallel, then the
  # display tests alone on the shared xvfb display.
  native-release:
    name: Native Release Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lfs: "true"
          ccache-key: native-release

      - name: Build native release tests (FULL asserts)
        run: |
          cmake --preset native-release-test -DNT_SKIP_EXAMPLE_PACKS="$NT_ALL_EXAMPLE_PACKS"
          cmake --build --preset native-release-test

      - name: Run tests (release)
        run: xvfb-run -a bash scripts/ci_ctest.sh --preset native-release-test

      - name: Check diagnostics configuration and runtime matrix
        run: |
          python3 scripts/check_diagnostics_config.py
          xvfb-run -a python3 scripts/check_diagnostics_runtime.py

      - name: Test optional UI features under NDEBUG
        run: |
          cmake --preset native-release-test -B build/_cmake/native-release-ui-on -DNT_FONT_EMBOLDEN_ENABLED=ON -DNT_UI_CLAY_DEBUG_VIEW=ON -DNT_HTTP_CURL=OFF -DNT_SKIP_EXAMPLE_PACKS="$NT_ALL_EXAMPLE_PACKS"
          cmake --build build/_cmake/native-release-ui-on --target test_font test_text_renderer test_nt_ui_label test_nt_ui_rich_build test_nt_ui_rich_wrap test_nt_ui_rich_emit test_nt_ui_rich_parse test_nt_ui_rich_custom test_nt_ui_clay_debug_view test_nt_ui_begin_end test_nt_ui_walker_custom
          xvfb-run -a bash scripts/ci_ctest.sh --test-dir build/_cmake/native-release-ui-on -R '^test_(font|text_renderer|nt_ui_(label|rich_(build|wrap|emit|parse|custom)|clay_debug_view|begin_end|walker_custom))$'

  # devapi + ui/obs/entity_write/capture groups ON so the devapi test targets build and run.
  native-debug:
    name: Native Debug Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lfs: "true"
          ccache-key: native-debug

      - name: Build native debug (FULL asserts, devapi ON)
        run: |
          cmake --preset native-debug -DNT_SKIP_EXAMPLE_PACKS="$NT_ALL_EXAMPLE_PACKS" -DNT_DEVAPI_ENABLED=ON -DNT_DEVAPI_GROUP_UI=ON -DNT_DEVAPI_GROUP_OBS=ON -DNT_DEVAPI_GROUP_ENTITY_WRITE=ON -DNT_DEVAPI_GROUP_CAPTURE=ON
          cmake --build --preset native-debug
          test -f build/engine/native-debug/libnt_core.a
          test -f build/engine/native-debug/libnt_log.a
          test -f build/engine/native-debug/libnt_log_stub.a
          ./build/tools/builder/native-debug/builder

      - name: Run tests (debug)
        run: xvfb-run -a bash scripts/ci_ctest.sh --preset native-debug

      - name: Submodule consumption test
        run: |
          cmake -S tests/submodule -B build/submodule-test \
            -DENGINE_ROOT=${{ github.workspace }} \
            -DCMAKE_C_COMPILER=clang -G Ninja
          cmake --build build/submodule-test
          ./build/submodule-test/submodule_test

  # Debug configurations that differ from native-debug in one feature set.
  native-variants:
    name: Native Feature Variants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lfs: "true"
          ccache-key: native-variants

      # Plain CMake defaults (inspector, ring, metrics, introspect, timing, capture OFF) under
      # Debug + FULL asserts + sanitizers: the only ctest over every stub body.
      - name: Build native debug with optional features OFF
        run: |
          cmake -B build/_cmake/native-debug-off -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_STANDARD=17 -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_C_COMPILER=clang -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DNT_UI_DEBUG_TOOLS=OFF -DNT_ASSERT_MODE=2 -DNT_SKELETAL_CHECKS=ON -DNT_UI_CHECKS=ON -DNT_GFX_NATIVE_GL_DEBUG=ON -DNT_HTTP_CURL=ON -DNT_SKIP_EXAMPLE_PACKS="$NT_ALL_EXAMPLE_PACKS" -G Ninja
          cmake --build build/_cmake/native-debug-off

      # The atlas tests check builder geometry and the sweep script, not optional features;
      # native-debug (sanitizers) and native-release run them.
      - name: Run tests (optional features OFF)
        run: xvfb-run -a bash scripts/ci_ctest.sh --test-dir build/_cmake/native-debug-off -E '^(test_atlas_hull_budget|test_atlas_transform_sweep_guard)$'

      # Each admission row (NT_BASISU_ROWS) consumes the Basis baseline through the trimmed
      # mirror and runs the Basis suites with the restricted set; the producer runs first.
      - name: Basis admission rows (FULL asserts)
        run: |
          base=build/_cmake/basisu-full
          cmake --preset native-debug -B "$base" -DNT_HTTP_CURL=OFF -DNT_SKIP_EXAMPLE_PACKS="$NT_ALL_EXAMPLE_PACKS"
          cmake --build "$base" --target test_basisu_golden_produce
          ctest --test-dir "$base" --output-on-failure --no-tests=error -R '^test_basisu_golden_produce$'
          for row in $NT_BASISU_ROWS; do
            name="${row%%:*}"
            flags="${row#*:}"
            cmake --preset native-debug -B "build/_cmake/$name" ${flags//,/ } -DNT_HTTP_CURL=OFF -DNT_SKIP_EXAMPLE_PACKS="$NT_ALL_EXAMPLE_PACKS"
            cmake --build "build/_cmake/$name" --target test_basisu_trimmed test_basisu_roundtrip test_gfx_basis_activate test_nt_gfx_basis_native test_builder
            xvfb-run -a bash scripts/ci_ctest.sh --test-dir "build/_cmake/$name" --no-tests=error -R '^test_(basisu_trimmed|basisu_roundtrip|gfx_basis_activate|nt_gfx_basis_native|builder)$'
          done

      - name: Test optional font geometry (FULL asserts)
        run: |
          cmake --preset native-debug -B build/_cmake/native-debug-embolden-on -DNT_FONT_EMBOLDEN_ENABLED=ON -DNT_HTTP_CURL=OFF -DNT_SKIP_EXAMPLE_PACKS="$NT_ALL_EXAMPLE_PACKS"
          cmake --build build/_cmake/native-debug-embolden-on --target test_font test_text_renderer test_nt_ui_label test_nt_ui_rich_build test_nt_ui_rich_wrap test_nt_ui_rich_emit test_nt_ui_rich_parse test_nt_ui_rich_custom
          xvfb-run -a bash scripts/ci_ctest.sh --test-dir build/_cmake/native-debug-embolden-on -R '^test_(font|text_renderer|nt_ui_label|nt_ui_rich_(build|wrap|emit|parse|custom))$'

      # Rows: Clay view OFF (the arena baseline), then ON with the inspector ON and OFF.
      - name: Test Clay view with both inspector settings
        run: |
          for row in "OFF ON" "ON ON" "ON OFF"; do
            read -r view inspector <<< "$row"
            build_dir="build/_cmake/native-debug-clay-${view}-${inspector}"
            cmake --preset native-debug -B "$build_dir" -DNT_UI_CLAY_DEBUG_VIEW="$view" -DNT_UI_DEBUG_TOOLS="$inspector" -DNT_HTTP_CURL=OFF -DNT_SKIP_EXAMPLE_PACKS="$NT_ALL_EXAMPLE_PACKS"
            cmake --build "$build_dir" --target test_nt_ui_clay_debug_view test_nt_ui_begin_end test_nt_ui_walker_custom test_nt_ui_inspector test_nt_ui_debug_hit_zones test_nt_ui_probe
            xvfb-run -a bash scripts/ci_ctest.sh --test-dir "$build_dir" -R '^test_nt_ui_(clay_debug_view|begin_end|walker_custom|inspector|debug_hit_zones|probe)$'
          done
          python3 scripts/check_clay_arena.py build/_cmake/native-debug-clay-OFF-ON build/_cmake/native-debug-clay-ON-ON
  # #endregion

  # #region lint and smoke
  lint:
    name: Format & Tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          extra-packages: clang-tidy

      - name: Check formatting
        run: |
          find engine shared tools examples -name '*.c' -o -name '*.h' | \
            xargs clang-format --dry-run --Werror

      # Module composition (no engine module links a real swappable impl; omitting an impl is a
      # loud unresolved-symbol error) and EM_JS_DEPS (Closure strips undeclared helpers in release).
      - name: Run module-composition and EM_JS_DEPS gates
        run: |
          bash scripts/check_no_real_impl_links.sh
          bash scripts/check_link_failure_loud.sh
          bash scripts/check_emjs_deps.sh

      # devapi groups ON so every devapi TU is in compile_commands.json with its real flags.
      - name: Configure
        run: cmake --preset native-debug -DNT_DEVAPI_ENABLED=ON -DNT_DEVAPI_GROUP_UI=ON -DNT_DEVAPI_GROUP_OBS=ON -DNT_DEVAPI_GROUP_ENTITY_WRITE=ON -DNT_DEVAPI_GROUP_CAPTURE=ON

      # The registration gate reads this job's compile DB / CTestTestfiles (devapi-gated tests visible).
      - name: Run CRT-pin, GL-funnel, test-registration and check-script gates
        run: |
          bash scripts/check_crt_pins.sh
          python3 scripts/check_gl_calls.py
          bash scripts/check_tests_registered.sh build/_cmake/native-debug
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          bash scripts/tests/test_check.sh
          bash scripts/tests/test_tidy.sh

      - name: Run clang-tidy
        run: bash scripts/tidy.sh build/_cmake/native-debug

      # The ASan compile DB above compiles the crash signal handlers out; lint them unsanitized.
      - name: Run clang-tidy on the crash handlers
        run: |
          cmake --preset native-release-test -B build/_cmake/tidy-crash -DNT_SKIP_EXAMPLE_PACKS="$NT_ALL_EXAMPLE_PACKS"
          clang-tidy -p build/_cmake/tidy-crash --quiet engine/crash/native/nt_crash_native.c tests/unit/test_crash_record.c

  devapi-smoke:
    name: DevAPI Smoke (live socket UAT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No LFS: devapi_host renders no asset pack (native capture.frame answers capture_unavailable).
      - uses: ./.github/actions/setup
        with:
          extra-packages: python3-pip
          ccache-key: devapi-smoke

      # Pillow + numpy are the capture-path-only decode deps, pinned + installed ONLY here.
      - name: Install capture-path Python deps (Pillow + numpy)
        run: python3 -m pip install --user -r tools/devapi/requirements-capture.txt

      # Hermetic pixel-health self-test (no GL/socket): exercises pixel_health's negative branches
      # (not-blank, dims, orientation, channel-order) with synthetic PNGs, so a silent weakening of the
      # capture safety net fails here, not only in the live socket run below.
      - name: Pixel-health self-test (hermetic)
        run: python3 tools/devapi/scenarios/pixel_health_selftest.py

      # devapi_host serves every group the canonical scenario touches. NT_PRESET_NAME pins the binary at
      # build/examples/devapi_host/native-debug so devapi_demo.py's self-launch finds it with no --host-bin.
      # This raw configure selects OBS's dependencies explicitly: log ring, metrics and introspect.
      - name: Build devapi host (groups the canonical scenario needs)
        run: |
          cmake -B build/examples/devapi_host/native-debug -DNT_PRESET_NAME=native-debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_STANDARD=17 -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_C_COMPILER=clang -G Ninja -DNT_ASSERT_MODE=2 -DNT_SKELETAL_CHECKS=ON -DNT_UI_CHECKS=ON -DNT_GFX_NATIVE_GL_DEBUG=ON -DNT_HTTP_CURL=ON -DNT_UI_DEBUG_TOOLS=ON -DNT_LOG_RING_ENABLED=ON -DNT_METRICS_ENABLED=ON -DNT_INTROSPECT_ENABLED=ON -DNT_INTROSPECT_WRITE_ENABLED=ON -DNT_DEVAPI_ENABLED=ON -DNT_DEVAPI_GROUP_CORE=ON -DNT_DEVAPI_GROUP_DISCOVERY=ON -DNT_DEVAPI_GROUP_TIME=ON -DNT_DEVAPI_GROUP_CAPTURE=ON -DNT_DEVAPI_GROUP_OBS=ON -DNT_GFX_CAPTURE_ENABLED=ON -DNT_GFX_GPU_TIMING_ENABLED=ON
          cmake --build build/examples/devapi_host/native-debug --target devapi_host

      # Self-launches devapi_host over the native socket and drives the canonical run(client);
      # xvfb-run supplies the headless X for nt_window_init().
      - name: Run devapi live-socket UAT
        run: xvfb-run -a python3 tools/devapi/scenarios/devapi_demo.py

  # The deferred-capture-over-web drain race is invisible to unit tests — only a real headless Chromium
  # proves it; devapi.spec.ts pumps frames deterministically via time.step, not rAF cadence.
  web-smoke:
    name: Web Smoke (devapi, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No LFS / pack builder: devapi_host loads no asset pack.
      - uses: ./.github/actions/setup
        with:
          emsdk: "true"
          ccache-key: web-smoke

      # Capture group ON arms the web host's pre-swap seam (NT_DEVAPI_HOST_WEB_CAPTURE): the deferred
      # capture.frame resolves to a REAL PNG, the behavior the live spec asserts.
      - name: Build devapi_host wasm (debug, capture ON)
        run: |
          emcmake cmake --preset wasm-debug -DNT_DEVAPI_ENABLED=ON -DNT_DEVAPI_GROUP_CORE=ON -DNT_DEVAPI_GROUP_DISCOVERY=ON -DNT_DEVAPI_GROUP_TIME=ON -DNT_DEVAPI_GROUP_CAPTURE=ON -DNT_DEVAPI_GROUP_OBS=ON
          cmake --build --preset wasm-debug --target devapi_host

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/browser/package-lock.json') }}

      - name: Install Playwright (pinned via lockfile) + Chromium
        run: |
          cd tests/browser
          npm ci
          npx playwright install --with-deps chromium

      # The devapi-chromium project's server defaults to build/examples/devapi_host/wasm-debug.
      - name: Run devapi web smoke test
        run: cd tests/browser && npx playwright test devapi.spec.ts

  # Three parts in parallel: the default smoke specs, the Basis admission rows and the
  # release diagnostics rows.
  browser-test:
    name: Browser (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [smoke, basis, diagnostics]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lfs: "true"
          emsdk: "true"
          ccache-key: browser-${{ matrix.part }}

      # browser_smoke reuses the ui_showcase example pack (RAW atlas) and its own Basis fixture
      # pack for the configured NT_BASISU_* set. Build both natively before ANY wasm configure
      # below: the showcase copy rule only exists when the pack does at configure time.
      - name: Build browser_smoke packs
        run: |
          cmake --preset native-debug
          cmake --build --preset native-debug --target ui_showcase_packs
          cmake --build --preset native-debug --target browser_smoke_packs

      - name: Build browser_smoke wasm (debug)
        if: matrix.part == 'smoke'
        run: |
          emcmake cmake --preset wasm-debug
          cmake --build --preset wasm-debug --target browser_smoke
          # A missing pack must fail here, not as a 30 s Playwright timeout.
          test -f build/tests/browser/app/wasm-debug/assets/ui_showcase.ntpack
          test -f build/tests/browser/app/wasm-debug/assets/basis_fixture.ntpack

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/browser/package-lock.json') }}

      - name: Install Playwright (pinned via lockfile) + Chromium
        run: |
          cd tests/browser
          npm ci
          npx playwright install --with-deps chromium

      # Only the specs that target browser_smoke; devapi.spec.ts needs devapi_host (Web Smoke job).
      - name: Run browser smoke test
        if: matrix.part == 'smoke'
        run: cd tests/browser && npx playwright test input.spec.ts rich.spec.ts rich_composition.spec.ts context_loss.spec.ts http.spec.ts diagnostics.spec.ts observation.spec.ts pass_actions.spec.ts mesh_color.spec.ts shape_strokes.spec.ts program_link.spec.ts crash.spec.ts

      # Each admission row (NT_BASISU_ROWS) activates its own fixture pack in wasm Debug (FULL
      # asserts) and samples the transcoded texels through WebGL; a Release row would add no
      # decision path (same selector, same SwiftShader caps). SwiftShader reports every
      # compressed cap, so the build set decides the target and real GPUs stay unverified here.
      - name: Basis admission rows (browser activation)
        if: matrix.part == 'basis'
        run: |
          for row in $NT_BASISU_ROWS; do
            name="${row%%:*}"
            flags="${row#*:}"
            cmake --preset native-debug -B "build/_cmake/$name-native" ${flags//,/ } -DNT_HTTP_CURL=OFF -DNT_SKIP_EXAMPLE_PACKS="$NT_ALL_EXAMPLE_PACKS"
            cmake --build "build/_cmake/$name-native" --target browser_smoke_packs
            dir="$name-wasm-debug"
            emcmake cmake --preset wasm-debug -B "build/_cmake/$dir" ${flags//,/ } -DNT_SKIP_EXAMPLE_PACKS="$NT_ALL_EXAMPLE_PACKS"
            cmake --build "build/_cmake/$dir" --target browser_smoke
            test -f "build/tests/browser/app/$dir/assets/ui_showcase.ntpack"
            test -f "build/tests/browser/app/$dir/assets/basis_fixture.ntpack"
            (cd tests/browser && CI=1 NT_SHOWCASE_DIR="$GITHUB_WORKSPACE/build/tests/browser/app/$dir" NT_SHOWCASE_PORT=8430 NT_DEVAPI_PORT=8431 npx playwright test context_loss.spec.ts --grep 'basis fixture:' --project=chromium --workers=1)
          done

      - name: Check release diagnostics with independent UI and GPU timing
        if: matrix.part == 'diagnostics'
        run: |
          for timing in "0 0" "0 1" "1 0"; do
            read -r ui gpu <<< "$timing"
            name="diagnostics-web-ui-$ui-gpu-$gpu"
            emcmake cmake --preset wasm-release -B "build/_cmake/$name" -DNT_PRESET_NAME="$name" -DNT_UI_TIMING_ENABLED="$ui" -DNT_GFX_GPU_TIMING_ENABLED="$gpu"
            cmake --build "build/_cmake/$name" --target browser_smoke
            test -f "build/tests/browser/app/$name/assets/ui_showcase.ntpack"
            test -f "build/tests/browser/app/$name/assets/basis_fixture.ntpack"
            pass_specs=""
            if [[ "$ui $gpu" == "0 0" ]]; then pass_specs="pass_actions.spec.ts crash.spec.ts"; fi
            (cd tests/browser && NT_SHOWCASE_DIR="$GITHUB_WORKSPACE/build/tests/browser/app/$name" NT_SHOWCASE_PORT=8430 NT_DEVAPI_PORT=8431 NT_DIAGNOSTICS_PRESET="$name" NT_DIAGNOSTICS_LOG=1 NT_DIAGNOSTICS_UI="$ui" NT_DIAGNOSTICS_GPU="$gpu" NT_DIAGNOSTICS_METRICS=0 NT_DIAGNOSTICS_TIMER_BASE=4294967296 npx playwright test diagnostics.spec.ts context_loss.spec.ts $pass_specs --project=chromium --workers=1)
          done
  # #endregion

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [packs, wasm-debug, wasm-release, wasm-analysis, native-release, native-debug, native-variants, lint, devapi-smoke, web-smoke, browser-test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Restores build/examples/<name>/<pack>.ntpack — upload-artifact roots the
      # archive at the pre-wildcard prefix of its glob (build/examples).
      - name: Download example packs
        uses: actions/download-artifact@v4
        with:
          name: example-packs
          path: build/examples

      - uses: ./.github/actions/setup
        with:
          native: "false"
          emsdk: "true"
          ccache-key: deploy
          ccache-size: 600M

      - name: Upload asset packs to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          for example_dir in build/examples/*/; do
            example_name=$(basename "$example_dir")
            for pack in "$example_dir"*.ntpack; do
              [ -f "$pack" ] || continue
              name=$(basename "$pack")
              echo "Uploading $example_name/$name to R2..."
              aws s3 cp "$pack" "s3://neotolis-assets/$example_name/$name" \
                --endpoint-url "$R2_ENDPOINT" \
                --no-progress \
                --content-type application/octet-stream \
                --cache-control "public, max-age=300, must-revalidate" # keys are unversioned; immutable would pin stale packs after updates
            done
          done

      # Metrics ON: the deployed bunnymark / ui_showcase HUDs read nt_metrics (stubs would show zeros).
      - name: Build paired WASM release for deploy
        run: |
          emcmake cmake --preset wasm-release-paired -DNT_CDN_URL="https://cdn.neotolis-engine.dev" -DNT_METRICS_ENABLED=ON
          emcmake cmake --preset wasm-release-simd -DNT_CDN_URL="https://cdn.neotolis-engine.dev" -DNT_METRICS_ENABLED=ON
          cmake --build --preset wasm-release-paired
          cmake --build --preset wasm-release-simd
          ./scripts/package_all_simd.sh wasm-release-paired wasm-release-simd

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-data
        continue-on-error: true

      - name: Preserve old size chart page
        run: |
          if [ -f "gh-pages-data/index.html" ] && ! [ -d "gh-pages-data/_astro" ]; then
            mkdir -p gh-pages-data/sizes
            cp gh-pages-data/index.html gh-pages-data/sizes/index.html
          fi

      - name: Copy WASM examples to gh-pages
        run: |
          for example_dir in build/examples/*/wasm-release-paired; do
            example_name=$(basename $(dirname "$example_dir"))
            mkdir -p "gh-pages-data/wasm/$example_name"
            cp "$example_dir"/*.html "$example_dir"/*.js "$example_dir"/*.wasm "gh-pages-data/wasm/$example_name/"
            if [ -f "$example_dir/CREDITS.md" ]; then
              cp "$example_dir/CREDITS.md" "gh-pages-data/wasm/$example_name/"
            fi
            if [ -f "$example_dir/README.md" ]; then
              cp "$example_dir/README.md" "gh-pages-data/wasm/$example_name/"
            fi
            if [ -d "$example_dir/licenses" ]; then
              cp -r "$example_dir/licenses" "gh-pages-data/wasm/$example_name/"
            fi
          done

      - name: Copy example cover images
        run: |
          for promo_dir in examples/*/site_promo; do
            example_name=$(basename $(dirname "$promo_dir"))
            if [ -f "$promo_dir/cover.png" ]; then
              mkdir -p "gh-pages-data/examples/$example_name"
              cp "$promo_dir/cover.png" "gh-pages-data/examples/$example_name/cover.png"
            fi
          done

      - name: Build promo site
        run: |
          cd neotolis-engine-site
          npm install
          npm run build

      - name: Copy site to deploy directory
        run: cp -r neotolis-engine-site/dist/* gh-pages-data/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy gh-pages-data --project-name=neotolis-engine --branch=main

  persist-sizes:
    name: Persist Size Data
    runs-on: ubuntu-latest
    needs: [wasm-release, wasm-analysis]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download size data
        uses: actions/download-artifact@v4
        with:
          pattern: wasm-size-*
          merge-multiple: true
          path: /tmp

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-data
        continue-on-error: true

      - name: Ensure gh-pages data directory exists
        run: mkdir -p gh-pages-data/sizes

      - name: Update size history and reports (all examples)
        run: |
          source scripts/wasm_examples.sh
          for example in "${WASM_EXAMPLES[@]}"; do
            mkdir -p "gh-pages-data/reports/$example"
            cp "/tmp/report_${example}.txt" "gh-pages-data/reports/$example/size-report.txt"

            TARGET_FILE="gh-pages-data/sizes/${example}.json"
            ENTRY=$(cat "/tmp/size_${example}.json")
            if [ -f "$TARGET_FILE" ]; then
              jq --argjson e "$ENTRY" '. += [$e]' "$TARGET_FILE" > /tmp/updated.json
              mv /tmp/updated.json "$TARGET_FILE"
            else
              echo "[$ENTRY]" > "$TARGET_FILE"
            fi
          done

      - name: Check for size regression
        run: |
          source scripts/wasm_examples.sh
          for example in "${WASM_EXAMPLES[@]}"; do
            TARGET_FILE="gh-pages-data/sizes/${example}.json"
            [ -f "$TARGET_FILE" ] || continue
            ENTRIES=$(jq length "$TARGET_FILE")
            if [ "$ENTRIES" -gt 1 ]; then
              # Check engine size regression
              PREV_ENGINE=$(jq '.[-2].engine.raw // .[-2].total.raw' "$TARGET_FILE")
              CURR_ENGINE=$(jq '.[-1].engine.raw' "$TARGET_FILE")
              if [ "$PREV_ENGINE" -gt 0 ]; then
                GROWTH=$(( (CURR_ENGINE - PREV_ENGINE) * 100 / PREV_ENGINE ))
                if [ "$GROWTH" -gt 10 ]; then
                  echo "::warning::${example}: engine size grew by ${GROWTH}% (${PREV_ENGINE}B -> ${CURR_ENGINE}B)"
                else
                  echo "${example}: engine size change ${GROWTH}% (${PREV_ENGINE}B -> ${CURR_ENGINE}B)"
                fi
              fi
              # Check total size regression
              PREV_TOTAL=$(jq '.[-2].total.raw' "$TARGET_FILE")
              CURR_TOTAL=$(jq '.[-1].total.raw' "$TARGET_FILE")
              if [ "$PREV_TOTAL" -gt 0 ]; then
                GROWTH=$(( (CURR_TOTAL - PREV_TOTAL) * 100 / PREV_TOTAL ))
                if [ "$GROWTH" -gt 10 ]; then
                  echo "::warning::${example}: total size grew by ${GROWTH}% (${PREV_TOTAL}B -> ${CURR_TOTAL}B)"
                else
                  echo "${example}: total size change ${GROWTH}% (${PREV_TOTAL}B -> ${CURR_TOTAL}B)"
                fi
              fi
            fi
          done

      - name: Persist size data to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-data
          keep_files: true

  pr-size-comment:
    name: PR Size Comment
    runs-on: ubuntu-latest
    needs: [wasm-release, wasm-analysis]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download size data
        uses: actions/download-artifact@v4
        with:
          pattern: wasm-size-*
          merge-multiple: true
          path: /tmp

      - name: Fetch baseline from gh-pages
        id: baseline
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-baseline
        continue-on-error: true

      - name: Generate size comment
        run: |
          source scripts/wasm_examples.sh
          EXAMPLES="${WASM_EXAMPLES[*]}"
          PR_COMMIT=$(git rev-parse --short HEAD)

          # Format bytes as KB/MB with 3 decimal places
          fmt() {
            local bytes="$1"
            if [ "$bytes" -ge 1048576 ]; then
              awk "BEGIN { printf \"%.3f MB\", $bytes / 1048576 }"
            elif [ "$bytes" -ge 1024 ]; then
              awk "BEGIN { printf \"%.3f KB\", $bytes / 1024 }"
            else
              printf "%d B" "$bytes"
            fi
          }

          # Format delta: +/- with KB/MB
          fmt_delta() {
            local bytes="$1"
            local abs=${bytes#-}
            local formatted
            if [ "$abs" -ge 1048576 ]; then
              formatted=$(awk "BEGIN { printf \"%.3f MB\", $abs / 1048576 }")
            elif [ "$abs" -ge 1024 ]; then
              formatted=$(awk "BEGIN { printf \"%.3f KB\", $abs / 1024 }")
            else
              formatted="${abs} B"
            fi
            [ "$bytes" -ge 0 ] && printf -- "+%s" "$formatted" || printf -- "-%s" "$formatted"
          }

          {
            echo "## WASM Build Sizes"
            echo ""

            for example in $EXAMPLES; do
              CURRENT=$(cat /tmp/size_${example}.json)
              BASELINE_FILE="gh-pages-baseline/sizes/${example}.json"
              HAS_BASELINE=false
              if [ -f "$BASELINE_FILE" ]; then
                BASELINE=$(jq '.[-1]' "$BASELINE_FILE")
                HAS_BASELINE=true
              fi

              cur_engine_raw=$(echo "$CURRENT" | jq -r '.engine.raw')
              cur_engine_gz=$(echo "$CURRENT" | jq -r '.engine.gzip')
              cur_res_raw=$(echo "$CURRENT" | jq -r '.resources.raw')
              cur_res_gz=$(echo "$CURRENT" | jq -r '.resources.gzip')
              cur_total_raw=$(echo "$CURRENT" | jq -r '.total.raw')
              cur_total_gz=$(echo "$CURRENT" | jq -r '.total.gzip')

              if [ "$HAS_BASELINE" = true ]; then
                base_engine_gz=$(echo "$BASELINE" | jq -r '.engine.gzip // 0')
                d_engine_gz=$((cur_engine_gz - base_engine_gz))
                base_total_gz=$(echo "$BASELINE" | jq -r '.total.gzip')
                d_total_gz=$((cur_total_gz - base_total_gz))
                summary_extra=" | engine $(fmt_delta $d_engine_gz) | total $(fmt_delta $d_total_gz)"
              else
                summary_extra=""
              fi

              # Build summary line: engine (+ resources if present)
              if [ "$cur_res_raw" -gt 0 ]; then
                summary_sizes="engine $(fmt $cur_engine_gz) gzip + resources $(fmt $cur_res_raw) = $(fmt $cur_total_gz) gzip"
              else
                summary_sizes="$(fmt $cur_total_gz) gzip"
              fi

              echo "<details>"
              echo "<summary><code>${example}</code> — ${summary_sizes}${summary_extra}</summary>"
              echo ""
              echo "| File | Raw | Gzip | Raw Delta | Gzip Delta |"
              echo "|------|----:|-----:|----------:|-----------:|"

              # Helper to print a file row with delta
              print_file_row() {
                local fname="$1"
                local cur_raw cur_gz d_raw_str d_gz_str
                cur_raw=$(echo "$CURRENT" | jq -r ".files[\"$fname\"].raw")
                cur_gz=$(echo "$CURRENT" | jq -r ".files[\"$fname\"].gzip")
                if [ "$HAS_BASELINE" = true ]; then
                  local base_raw base_gz d_raw d_gz
                  base_raw=$(echo "$BASELINE" | jq -r ".files[\"$fname\"].raw // 0")
                  base_gz=$(echo "$BASELINE" | jq -r ".files[\"$fname\"].gzip // 0")
                  d_raw=$((cur_raw - base_raw))
                  d_gz=$((cur_gz - base_gz))
                  d_raw_str="$(fmt_delta $d_raw)"
                  d_gz_str="$(fmt_delta $d_gz)"
                else
                  d_raw_str="--"
                  d_gz_str="--"
                fi
                printf "| \`%s\` | %s | %s | %s | %s |\n" "$fname" "$(fmt $cur_raw)" "$(fmt $cur_gz)" "$d_raw_str" "$d_gz_str"
              }

              # Engine files (not starting with assets/)
              for fname in $(echo "$CURRENT" | jq -r '.files | keys[]' | sort); do
                case "$fname" in assets/*) continue ;; esac
                print_file_row "$fname"
              done

              # Compute deltas for subtotals
              if [ "$HAS_BASELINE" = true ]; then
                base_engine_raw=$(echo "$BASELINE" | jq -r '.engine.raw // 0')
                base_res_raw=$(echo "$BASELINE" | jq -r '.resources.raw // 0')
                base_res_gz=$(echo "$BASELINE" | jq -r '.resources.gzip // 0')
                d_engine_raw=$((cur_engine_raw - base_engine_raw))
                d_engine_gz=$((cur_engine_gz - base_engine_gz))
                d_res_raw=$((cur_res_raw - base_res_raw))
                d_res_gz=$((cur_res_gz - base_res_gz))
                d_total_raw=$((cur_total_raw - $(echo "$BASELINE" | jq -r '.total.raw')))
                d_total_gz=$((cur_total_gz - base_total_gz))
              fi

              # Engine subtotal
              if [ "$HAS_BASELINE" = true ]; then
                echo "| **Engine** | **$(fmt $cur_engine_raw)** | **$(fmt $cur_engine_gz)** | **$(fmt_delta $d_engine_raw)** | **$(fmt_delta $d_engine_gz)** |"
              else
                echo "| **Engine** | **$(fmt $cur_engine_raw)** | **$(fmt $cur_engine_gz)** | **--** | **--** |"
              fi

              # Resources files + subtotal (only if resources exist)
              if [ "$cur_res_raw" -gt 0 ]; then
                for fname in $(echo "$CURRENT" | jq -r '.files | keys[]' | sort); do
                  case "$fname" in assets/*) ;; *) continue ;; esac
                  print_file_row "$fname"
                done
                if [ "$HAS_BASELINE" = true ]; then
                  echo "| **Resources** | **$(fmt $cur_res_raw)** | **$(fmt $cur_res_gz)** | **$(fmt_delta $d_res_raw)** | **$(fmt_delta $d_res_gz)** |"
                else
                  echo "| **Resources** | **$(fmt $cur_res_raw)** | **$(fmt $cur_res_gz)** | **--** | **--** |"
                fi
              fi

              # Total
              if [ "$HAS_BASELINE" = true ]; then
                echo "| **Total** | **$(fmt $cur_total_raw)** | **$(fmt $cur_total_gz)** | **$(fmt_delta $d_total_raw)** | **$(fmt_delta $d_total_gz)** |"
              else
                echo "| **Total** | **$(fmt $cur_total_raw)** | **$(fmt $cur_total_gz)** | **--** | **--** |"
              fi
              echo ""
              echo "</details>"
              echo ""
            done

            if [ -f "gh-pages-baseline/sizes/hello.json" ]; then
              base_commit=$(jq -r '.[-1].commit' "gh-pages-baseline/sizes/hello.json")
            else
              base_commit="none"
            fi
            echo "<sub>Baseline: master@${base_commit} | PR: ${PR_COMMIT}</sub>"
          } > /tmp/pr_comment.md

      - name: Post PR size comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY=$(cat /tmp/pr_comment.md)
          PR_NUMBER=${{ github.event.pull_request.number }}

          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -X POST -f body="$COMMENT_BODY"
          echo "Created size comment"

      - name: Generate size report comment
        run: |
          source scripts/wasm_examples.sh
          EXAMPLES="${WASM_EXAMPLES[*]}"
          PR_COMMIT=$(git rev-parse --short HEAD)

          {
            echo "## WASM Size Reports"
            echo ""

            for example in $EXAMPLES; do
              PR_REPORT="/tmp/report_${example}.txt"
              BASE_REPORT="gh-pages-baseline/reports/${example}/size-report.txt"

              echo "<details>"

              if [ -f "$BASE_REPORT" ]; then
                echo "<summary><code>${example}</code> — Size Report Diff</summary>"
                echo ""
                echo '```diff'
                diff --unified=1000 "$BASE_REPORT" "$PR_REPORT" | tail -n +4 || true
                echo '```'
              else
                echo "<summary><code>${example}</code> — Size Report (no baseline)</summary>"
                echo ""
                echo '```'
                cat "$PR_REPORT"
                echo '```'
              fi

              echo "</details>"
              echo ""
            done

            if [ -f "gh-pages-baseline/reports/hello/size-report.txt" ]; then
              base_commit=$(head -2 "gh-pages-baseline/reports/hello/size-report.txt" | grep '# Commit:' | awk '{print $3}')
            else
              base_commit="none"
            fi
            echo "<sub>PR: ${PR_COMMIT} | Baseline: ${base_commit:-none}</sub>"
          } > /tmp/report_comment.md

      - name: Post size report comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY=$(cat /tmp/report_comment.md)
          PR_NUMBER=${{ github.event.pull_request.number }}

          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -X POST -f body="$COMMENT_BODY"
          echo "Created size report comment"
