# Песнь Тамги — балансные скаляры (key = value, '#' — комментарий).
# Этот файл правит GDD-агент. Кор читает его в рантайме (без перекомпиляции).
# Таблицы тайлов/наследников — в tiles.tsv / heirs.tsv. См. CONFIG.md.

# --- структура забега ---
# 1 = старт сразу в забег (без меню), 0 = главное меню
start_in_game = 1
# 1 = авто-заполнять клетки случайными тайлами (debug-режим); 0 = пусто, тайлы ставит игрок
debug_random_desert = 0
laps_to_win = 10
start_stamina = 10
move_seconds_per_cell = 1.5
# FTUE-вступление: герой выходит из аула на дорогу перед началом кольца.
aul_exit_seconds = 2.0
road_entry_seconds = 0.7
# Песчаная буря между кругами: вуаль скрывает пересборку пути (путь разный каждый круг).
storm_seconds = 1.3

# --- карта/дорога: концентрические полосы вокруг аула ---
# Аул 2x2 в центре -> полоса дороги (road_band клеток вокруг, строить нельзя) ->
# внешнее поле для построек (остальное до края зоны).
# Зона = аул + 2*(road_band + поле). 18 = 2 + 2*(2 + 6): поле 6 клеток наружу.
map_zone_cols = 18
map_zone_rows = 18
# Аул (клетки) в центре зоны.
map_aul_w = 2
map_aul_h = 2
# Дорога живёт в пределах road_band клеток от аула (полоса дороги, no-build).
map_road_band = 2
# Изгибы дороги в пределах полосы: число = base + per_circle*(круг-1) + рандом(0..jitter).
map_bends_base = 5
map_bends_per_circle = 1
map_bends_jitter = 3

# DEPRECATED: длина лупа теперь из map_* (выше). Эти ключи больше не влияют.
path_cells = 12
path_cells_growth = 1
path_cells_jitter = 1

# --- проверки (stat check) ---
# difficulty = check_base_difficulty + check_difficulty_per_circle * circle
check_base_difficulty = 1
check_difficulty_per_circle = 1
check_fail_stamina_loss = 2
# доля награды при провале проверки, в процентах (0..100)
check_fail_reward_pct = 50

# --- Последняя Тамга: wisdom = base + per_circle*circle + floor(slot/slot_div); glory = wisdom/glory_div ---
tamga_wisdom_base = 3
tamga_wisdom_per_circle = 3
tamga_wisdom_slot_div = 3
tamga_glory_div = 3
tamga_max_active = 3

# --- смерть: сколько ресурсов забега уходит в аул, в процентах ---
death_keep_supplies_pct = 50
death_keep_wisdom_pct = 100
death_keep_glory_pct = 50
