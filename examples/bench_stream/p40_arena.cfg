# vsync-off (chrome-command-line): nt_frame_arena against the frame1 and ring arms. arena copies
# every episode per frame (a renderer packs); frame1 only touches one float. arena_headroom uploads half its
# capacity every frame, the partial-rewrite shape of a game that sizes capacity from the peak.
families=inst
episodes=1,5,20
instances=64,1024
inst_arms=ring,frame1,arena,arena_headroom
reps=2
warmup=1.0
window=3.0
